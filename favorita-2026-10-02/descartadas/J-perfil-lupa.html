<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Perfil · rótulos + lupa que cae</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..600&family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#efe6d0; --papel:#f4ecd6; --ink:#2b2013; --soft:#55452f; --line:rgba(43,32,19,.34); --acento:#c4552d; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 400 15px/1.6 "DM Sans", system-ui, sans-serif; color: var(--ink); background: #2b2013; }
  /* La página es alta: el escenario queda fijo y el scroll controla la caída de la lupa */
  #alto { height: 260vh; position: relative; }
  #escena { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #efe6d0 url(../media/fondo-perfil.jpg) center / cover; }
  #escena::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 6px rgba(80,45,10,.28); z-index: 9; }
  .mancha { position: absolute; pointer-events: none; background: radial-gradient(ellipse at center, rgba(244,236,214,.94) 0%, rgba(244,236,214,.86) 45%, rgba(244,236,214,0) 72%); filter: blur(6px); }
  .n { font: 500 11px "JetBrains Mono"; letter-spacing: .2em; text-transform: uppercase; color: var(--soft); }
  h1 { font: 600 clamp(42px, 5.6vw, 90px)/1 Lora; letter-spacing: -.02em; margin: 10px 0 14px; }
  .t1 { position: absolute; left: 4vw; top: 12vh; width: 42vw; z-index: 3; } .lead { font: 400 clamp(17px, 1.5vw, 23px)/1.6 "DM Sans"; max-width: 36ch; }

  /* Las cuatro capacidades: son los botones que cambian el párrafo de la lupa */
  .lista { position: absolute; left: 4vw; top: 46vh; width: 36vw; z-index: 3; }
  .it { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 70px 1fr; align-items: center; width: 100%; padding: 14px 0 13px; position: relative; cursor: pointer; }
  .it::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 1px; background: var(--ink); opacity: .55; } .it::after { content: ""; position: absolute; left: 0; top: -1px; width: 38px; height: 3px; background: var(--acento); transition: width .35s; }
  .it .k { font: 400 40px/1 Lora; color: var(--acento); letter-spacing: -.04em; opacity: .55; transition: opacity .25s; } .it .nm { font: 600 clamp(18px, 1.5vw, 23px) Lora; transition: transform .25s, color .25s; }
  .it:hover .nm { transform: translateX(6px); } .it.on .k { opacity: 1; } .it.on .nm { color: var(--acento); } .it.on::after, .it:hover::after { width: 100%; }
  .it:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .lista .cierre { height: 1px; background: var(--ink); opacity: .55; }

  /* La lupa: cae desde arriba con rebote y oscilación, y se asienta sobre la isla */
  #lupa { position: absolute; right: 9vw; top: 12vh; width: min(54vh, 36vw); aspect-ratio: 1; z-index: 5; will-change: transform; transform-origin: 80% 20%; }
  #lupa .aro { position: absolute; inset: 0; border-radius: 50%; border: 8px solid #8a6a3a; box-shadow: 0 0 0 2px #4a3519, inset 0 0 0 2px #d9b877, inset 0 0 44px rgba(255,255,255,.4), 0 34px 60px -22px rgba(40,22,5,.75); background: radial-gradient(circle at 30% 24%, rgba(255,255,255,.6), rgba(255,255,255,.14) 55%, rgba(255,255,255,.05)); backdrop-filter: blur(15px) saturate(1.5) brightness(1.05); -webkit-backdrop-filter: blur(15px) saturate(1.5) brightness(1.05); }
  /* Mango clásico: sale en diagonal desde el aro; cuello metálico, empuñadura de madera ahusada y remate */
  #lupa .mango { position: absolute; left: 50%; top: 50%; width: 100%; height: 9.5%; transform-origin: 0 50%; transform: rotate(46deg) translateY(-50%); z-index: -1; filter: drop-shadow(0 10px 8px rgba(30,15,3,.45)); pointer-events: none; }
  #lupa .mango i { position: absolute; top: 50%; display: block; transform: translateY(-50%); }
  #lupa .mango .cuello { left: 47.5%; width: 12%; height: 62%; background: linear-gradient(180deg, #f1dc9f, #b88f3c 45%, #6d4e1c); border-radius: 3px; }
  #lupa .mango .agarre { left: 58.5%; width: 41%; height: 100%; background: repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 14%, rgba(0,0,0,.16) 14% 15.5%), linear-gradient(180deg, #b98a52 0%, #8a5a2b 38%, #4d2f14 100%); clip-path: polygon(0 14%, 100% 0, 100% 100%, 0 86%); border-radius: 0 40% 40% 0 / 0 50% 50% 0; box-shadow: inset 0 3px 3px rgba(255,235,190,.35); }
  #lupa .mango .remate { left: 98.5%; width: 4.5%; height: 100%; background: radial-gradient(circle at 35% 30%, #f1dc9f, #8a6a3a 60%, #4a3519); border-radius: 50%; }
  #lupa .mango .anillo { left: 56.5%; width: 3%; height: 74%; background: linear-gradient(180deg, #f4e2ad, #8a6a3a); border-radius: 2px; }
  #lupa .brillo { position: absolute; left: 14%; top: 10%; width: 30%; height: 14%; border-radius: 50%; background: linear-gradient(120deg, rgba(255,255,255,.85), rgba(255,255,255,0)); transform: rotate(-35deg); filter: blur(2px); pointer-events: none; }
  #lupa .dentro { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 14%; }
  .pagina { transition: opacity .28s, transform .4s cubic-bezier(.2,.8,.2,1); } .pagina.sale { opacity: 0; transform: translateY(8px) scale(.97); }
  .pagina .k { font: 500 11px "JetBrains Mono"; letter-spacing: .2em; color: var(--acento); } .pagina b { display: block; font: 600 clamp(22px, 2vw, 31px)/1.15 Lora; margin: 8px 0 10px; } .pagina p { font-size: clamp(14px, 1.15vw, 17px); color: var(--ink); line-height: 1.55; }
  /* Controles de la lupa: puntos y flechas, pegados abajo del aro */
  #ctl { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 6; }
  #ctl button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(43,32,19,.5); background: rgba(244,236,214,.7); cursor: pointer; font: 500 15px "DM Sans"; color: var(--ink); transition: background .2s, color .2s; } #ctl button:hover { background: var(--ink); color: var(--papel); }
  #ctl .pts { display: flex; gap: 7px; } #ctl .pts i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); display: block; transition: background .2s, transform .2s; cursor: pointer; } #ctl .pts i.on { background: var(--acento); border-color: var(--acento); transform: scale(1.3); }
  #guia { position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%); z-index: 8; font: 500 11px "JetBrains Mono"; letter-spacing: .26em; text-transform: uppercase; color: var(--soft); transition: opacity .4s; text-align: center; } #guia span { display: block; margin-top: 6px; animation: baja 1.8s ease-in-out infinite; } @keyframes baja { 50% { transform: translateY(6px); } }
  #pie { position: absolute; left: 4vw; bottom: 3.5vh; z-index: 8; font: 500 11px "JetBrains Mono"; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
  @media (max-width: 860px) { .t1 { width: 90vw; top: 9vh; } .lista { left: 4vw; width: 92vw; top: 49vh; } #lupa { right: 50%; margin-right: calc(min(60vw, 36vh) / -2); top: 20vh; width: min(60vw, 36vh); } .it { grid-template-columns: 54px 1fr; padding: 9px 0 8px; } .it .k { font-size: 30px; } }
  @media (prefers-reduced-motion: reduce) { #lupa { transform: none !important; } }
</style>
</head>
<body>
<div id="alto"><div id="escena">
  <div class="mancha" style="left:-4vw;top:4vh;width:56vw;height:92vh"></div>
  <div class="t1"><div class="n">01 / 09 — Sobre mí</div><h1>Perfil</h1>
    <p class="lead">Acompaño a usuarios y equipos técnicos para que los sistemas funcionen. Como también construyo, entiendo el problema desde el usuario hasta el código.</p></div>
  <div class="lista" id="lista"></div>
  <div id="lupa"><div class="mango"><i class="cuello"></i><i class="agarre"></i><i class="anillo"></i><i class="remate"></i></div><div class="aro"></div><div class="dentro"><div class="pagina" id="pagina"></div></div><div class="brillo"></div>
    <div id="ctl"><button id="ant" aria-label="Anterior">←</button><div class="pts" id="pts"></div><button id="sig" aria-label="Siguiente">→</button></div></div>
  <div id="pie">Perfil · lupa</div><div id="guia">Desplázate<span>↓</span></div>
</div></div>
<script>
// Textos fieles a la hoja de vida
const Q = [
  ['Soporte y seguimiento', 'Atiendo incidentes y requerimientos, recopilo la información necesaria para diagnosticarlos y les doy seguimiento hasta cerrarlos.'],
  ['Validación funcional', 'Verifico requerimientos, datos y comportamiento esperado de cada funcionalidad antes de su implementación.'],
  ['Documentación', 'Elaboro y actualizo documentación técnica, funcional y operativa para que los procesos se puedan consultar y continuar.'],
  ['Coordinación técnica', 'Coordino con los equipos de desarrollo y QA para resolver dudas, validar avances y dar continuidad a las soluciones.'],
]
const $ = (s) => document.querySelector(s), clamp = (v, a, b) => Math.max(a, Math.min(b, v))
let actual = 0, ocupado = false
$('#lista').innerHTML = Q.map((q, i) => `<button class="it" data-i="${i}"><span class="k">0${i + 1}</span><span class="nm">${q[0]}</span></button>`).join('') + '<div class="cierre"></div>'
$('#pts').innerHTML = Q.map((q, i) => `<i data-i="${i}"></i>`).join('')
function mostrar(i, inicial) {
  i = (i + Q.length) % Q.length
  const pg = $('#pagina'), poner = () => { pg.innerHTML = `<div class="k">0${i + 1} / 0${Q.length}</div><b>${Q[i][0]}</b><p>${Q[i][1]}</p>`; pg.classList.remove('sale') }
  actual = i
  document.querySelectorAll('.it').forEach((b, n) => b.classList.toggle('on', n === i)); document.querySelectorAll('#pts i').forEach((b, n) => b.classList.toggle('on', n === i))
  if (inicial) return poner()
  pg.classList.add('sale'); setTimeout(poner, 260)
  sacudida = 1   // la lupa se mece un instante al cambiar de párrafo
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) mostrar(+b.dataset.i) })
$('#ant').onclick = () => mostrar(actual - 1); $('#sig').onclick = () => mostrar(actual + 1)
addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') mostrar(actual - 1); if (e.key === 'ArrowRight') mostrar(actual + 1) })

/* Caída: rebote (easeOutBounce) + oscilación amortiguada de la inclinación, según el scroll */
const rebote = (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375 }
let sacudida = 0, pS = 0
function pinta() {
  const meta = clamp(scrollY / (innerHeight * 1.0), 0, 1)
  pS += (meta - pS) * .12
  const t = clamp((pS - .04) / .56, 0, 1), y = (1 - rebote(t)) * -125, giro = (1 - t) * 38 * Math.cos(t * 11) + (t < 1 ? 0 : 0)
  sacudida *= .93; const mece = Math.sin(performance.now() / 90) * 3 * sacudida
  $('#lupa').style.transform = `translateY(${y.toFixed(2)}vh) rotate(${(giro + mece).toFixed(2)}deg)`
  $('#lupa').style.opacity = t > 0 ? 1 : 0
  $('#guia').style.opacity = pS < .1 ? 1 : 0
  requestAnimationFrame(pinta)
}
mostrar(0, true); pinta()
</script>
</body>
</html>

  #velo { position: fixed; z-index: 15; inset: 0 auto 0 0; width: 68vw; pointer-events: none; opacity: 1; background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 90%, transparent) 0%, color-mix(in srgb, var(--bg) 72%, transparent) 55%, transparent 100%); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); -webkit-mask-image: linear-gradient(90deg, #000 60%, transparent); mask-image: linear-gradient(90deg, #000 60%, transparent); }
  /* Control de recorrido: flechas + regla con porcentaje, al estilo de la escala de un mapa */
  #nav3 { position: fixed; z-index: 28; right: clamp(8px, 1.1vw, 18px); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #nav3 .fl { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); background: color-mix(in srgb, var(--bg) 52%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); cursor: pointer; display: grid; place-items: center; box-shadow: 0 10px 26px -12px rgba(60,35,10,.55), inset 0 1px 0 rgba(255,255,255,.6); transition: background .2s, color .2s, opacity .3s; } #nav3 .fl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } #nav3 .fl:hover { background: var(--ink); color: var(--bg); } #nav3 .fl:disabled { opacity: .25; pointer-events: none; }
  #regla { position: relative; width: 30px; height: min(36vh, 300px); }

  #regla .mk { position: absolute; left: 7px; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--acento); border: 2.5px solid var(--bg); box-shadow: 0 0 0 1px var(--acento), 0 4px 10px rgba(0,0,0,.25); pointer-events: none; }
  #pct { font: 600 17px "Lora"; line-height: 1; } #pct small { font: 500 10px "JetBrains Mono"; margin-left: 1px; color: var(--soft); }
  #progMov { display: none; position: fixed; z-index: 28; left: 14px; right: 14px; top: 60px; height: 3px; border-radius: 3px; background: var(--line); } #progMov i { display: block; height: 100%; border-radius: 3px; background: var(--acento); width: 0; }
  /* Sección de IA aplicada */
  .iac .ic { width: 42px; height: 42px; border-radius: 13px; background: var(--c); color: #fff; display: grid; place-items: center; margin-bottom: 12px; box-shadow: 0 10px 22px -10px var(--c); } .iac .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .iac h3 { margin-bottom: 6px; } .iac p { font-size: clamp(13px, 1.02vw, 15.5px) !important; } .etiq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; } .etiq span { font: 500 10px "JetBrains Mono"; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: var(--ink); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .pasos { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; } .pasos span { font: 500 11px "JetBrains Mono"; letter-spacing: .1em; text-transform: uppercase; padding: 8px 14px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 48%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.5); } .pasos em { font-style: normal; color: var(--acento); }

  /* Índice y lista (modo ligero) */
  #indice { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); display: none; padding: 90px clamp(18px, 6vw, 90px); overflow: auto; } #indice.abierto { display: block; }
  #indice a { display: flex; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--line); font: 600 clamp(22px, 3.2vw, 44px) "Lora"; letter-spacing: -.02em; text-decoration: none; cursor: pointer; } #indice a span { font: 400 11px "JetBrains Mono"; letter-spacing: .2em; color: var(--soft); padding-top: 14px; width: 40px; } #indice a:hover { padding-left: 14px; transition: .25s; }
  #lista { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow: auto; display: none; padding: 90px clamp(18px, 8vw, 140px) 120px; } #lista.abierta { display: block; }
  #lista .info { position: static; visibility: visible; pointer-events: auto; max-width: 760px; margin: 0 0 70px; } #lista .blq { position: static !important; opacity: 1 !important; transform: none !important; width: auto !important; margin: 0 0 14px; pointer-events: auto; }

  /* Cursor propio: cambia de forma segun lo que toca (mar, isla, enlace, video, viaje) */
  html.cursor-propio, html.cursor-propio * { cursor: none !important; }
  #tinta { position: fixed; inset: 0; z-index: 90; pointer-events: none; }

  #cur .anillo::before, #cur .anillo::after { content: ""; position: absolute; background: currentColor; transition: opacity .25s; }
  #cur .anillo::before { width: 1px; height: 10px; left: 50%; top: -5px; box-shadow: 0 34px currentColor; } #cur .anillo::after { height: 1px; width: 10px; top: 50%; left: -5px; box-shadow: 34px 0 currentColor; }
  #cur .pt { position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: currentColor; transition: opacity .2s, transform .2s; }
  #cur .ico { font: 600 12px "Lora"; letter-spacing: .12em; opacity: 0; transition: opacity .2s; position: relative; z-index: 1; }
  #cur .eti { position: absolute; left: 24px; top: 14px; white-space: nowrap; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); text-shadow: 0 0 6px var(--bg), 0 0 6px var(--bg); transition: opacity .25s; }
  #cur[data-e="isla"] .anillo { width: 84px; height: 84px; margin: -42px 0 0 -42px; border-style: dashed; animation: gira 14s linear infinite; } #cur[data-e="isla"] .anillo::before, #cur[data-e="isla"] .anillo::after { opacity: 0; }
  #cur[data-e="isla"] .eti { left: 50px; top: -8px; color: var(--ink); font: italic 600 15px "Cormorant Garamond"; letter-spacing: .14em; }
  #cur[data-e="enlace"] .anillo { width: 58px; height: 58px; margin: -29px 0 0 -29px; background: var(--ink); color: var(--bg); } #cur[data-e="enlace"] .anillo::before, #cur[data-e="enlace"] .anillo::after { opacity: 0; } #cur[data-e="enlace"] .pt { opacity: 0; } #cur[data-e="enlace"] .ico { opacity: 1; color: var(--bg); } #cur[data-e="enlace"] .eti { opacity: 0; }
  #cur[data-e="play"] .anillo { width: 70px; height: 70px; margin: -35px 0 0 -35px; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(6px); } #cur[data-e="play"] .anillo::before, #cur[data-e="play"] .anillo::after { opacity: 0; } #cur[data-e="play"] .pt { opacity: 0; } #cur[data-e="play"] .ico { opacity: 1; } #cur[data-e="play"] .eti { opacity: 0; }
  #cur[data-e="viaje"] .anillo { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-width: 2px; } #cur[data-e="viaje"] .anillo::before, #cur[data-e="viaje"] .anillo::after { opacity: 0; } #cur[data-e="viaje"] .ico { opacity: 1; font-size: 18px; } #cur[data-e="viaje"] .eti { opacity: 0; }
  #cur[data-e="texto"] .anillo { width: 2px; height: 26px; margin: -13px 0 0 -1px; border-radius: 1px; background: currentColor; } #cur[data-e="texto"] .anillo::before, #cur[data-e="texto"] .anillo::after, #cur[data-e="texto"] .pt, #cur[data-e="texto"] .eti { opacity: 0; }
  #cur.pulsa .anillo { transform: scale(.78); }
  @keyframes gira { to { transform: rotate(360deg); } }
  .etq { transition: opacity .35s, letter-spacing .35s; } .etq.caliente b { letter-spacing: .26em; }

  /* ═══ Estilo «Rótulos»: sin cajas. Filete naranja sobre una línea fina, numerales grandes y una «mancha» de papel de bordes difusos como único fondo ═══ */
  .blq.panel, .conoc, .blq:has(> .fila-mini) { background: none !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; position: absolute; }
  .blq.panel, .conoc { padding: 22px 6px 14px 4px !important; }
  /* la mancha: lavado radial de papel que aclara el mapa justo bajo el texto */
  .blq.panel::before, .conoc::before, .blq:has(> .fila-mini)::before { content: ""; position: absolute; inset: -26px -52px -22px -44px; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--bg) 95%, transparent) 0%, color-mix(in srgb, var(--bg) 88%, transparent) 46%, color-mix(in srgb, var(--bg) 0%, transparent) 74%); filter: blur(5px); }
  /* línea fina + filete naranja encima */
  .blq.panel::after, .conoc::after, .blq:has(> .fila-mini)::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--ink); opacity: .55; }
  .blq.panel > :first-child, .conoc > :first-child { position: relative; }
  .blq.panel .filete, .blq.panel::marker { display: none; }
  .blq.panel, .conoc, .blq:has(> .fila-mini) { --fil: var(--acento); }
  .conoc { --fil: var(--c, var(--acento)); }
  .blq.panel > *, .conoc > * { position: relative; }
  .blq.panel > :first-child::before, .conoc > :first-child::before { content: ""; position: absolute; left: 0; top: -22px; width: 54px; height: 3px; background: var(--fil); }
  .blq:has(> .fila-mini)::after { display: none; }
  /* las cuatro capacidades: numerales grandes en naranja */
  .fila-mini { counter-reset: m; gap: 0 !important; }
  .mini { counter-increment: m; background: none !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; position: relative; padding: 22px 22px 8px 0 !important; }
  .mini::before { content: ""; position: absolute; left: 0; right: 14px; top: 0; height: 1px; background: var(--ink); opacity: .55; } .mini::after { content: ""; position: absolute; left: 0; top: -1px; width: 38px; height: 3px; background: var(--acento); }
  .mini b { font: 400 clamp(34px, 3vw, 48px)/1 Lora !important; color: var(--acento); letter-spacing: -.04em; margin-bottom: 6px !important; } .mini b::before { content: counter(m, decimal-leading-zero) " "; display: none; }
  .mini b::after { content: ""; }
  .mini { display: grid; grid-template-columns: 1fr; align-content: start; } .mini .nm { display: block; min-height: 2.5em; line-height: 1.2; }
  /* pasos de IA y etiquetas: texto con subrayado naranja, sin pastillas de cristal */
  .pasos span { background: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; border: 0 !important; border-bottom: 2px solid var(--acento) !important; border-radius: 0 !important; padding: 6px 2px !important; color: var(--ink); }
  .pasos em { color: var(--acento); }
  /* tarjetas de IA: ícono + título directamente sobre la mancha */
  .iac { rotate: 0deg; }
  .iac .ic { border-radius: 10px; margin-bottom: 10px; }
  /* textos: más contraste */
  .info p, .blq.panel li, .mini span { color: color-mix(in srgb, var(--ink) 86%, var(--bg)); }
  .blq.panel li { border-top-color: var(--line); } .blq.panel li::before { color: var(--acento); }
  .blq.panel .datos strong { color: var(--acento); }
  .blq.panel p, .blq.panel li, .blq.panel h2, .blq.panel h3, .blq.panel .n, .conoc p { text-shadow: none; }

  /* Detalles tomados de las otras opciones, en pequeño: botón de cerrar, ruta punteada y cartela con sello */
  .conoc .cerrar { position: absolute !important; right: 4px; top: 14px; z-index: 3; }
  .conoc > :first-child::before { display: none; }
  .mini::before { background: repeating-linear-gradient(90deg, var(--acento) 0 3px, transparent 3px 9px) !important; height: 2px !important; opacity: .85 !important; right: 0 !important; }
  .mini::after { width: 11px !important; height: 11px !important; border-radius: 50%; top: -5px !important; left: 0; background: var(--acento); box-shadow: 0 0 0 3px var(--bg); }
  .blq.cartela { border: 1.5px solid var(--ink) !important; padding: 34px 38px 28px !important; }
  .blq.cartela::after { inset: 6px !important; left: 6px !important; right: 6px !important; top: 6px !important; bottom: 6px !important; height: auto !important; background: none !important; border: 1px solid var(--ink); opacity: .6 !important; pointer-events: none; }
  .blq.cartela > :first-child::before { display: none; }
  .blq.cartela .sello { position: absolute; right: -30px; top: -30px; width: 66px; height: 66px; z-index: 2; }

  /* ═══ Texto con movimiento ligado al scroll: los títulos suben palabra a palabra desde una máscara y los párrafos se «escriben» palabra por palabra ═══ */
  .blq { --e: 1; }
  .pw { display: inline-block; overflow: hidden; vertical-align: bottom; padding: .08em .08em .34em .04em; margin: -.08em -.04em -.34em 0; }   /* más espacio abajo y arriba: así la cola de la J, la p o la g no quedan cortadas */
  .pi { display: inline-block; --q: clamp(0, calc(var(--e) * 2.3 - var(--i) / var(--n) * 1.25), 1); transform: translateY(calc((1 - var(--q)) * 165%)) rotate(calc((1 - var(--q)) * 4deg)); transform-origin: 0 100%; will-change: transform; }
  .pp { display: inline-block; --q: clamp(0, calc(var(--e) * 2.6 - var(--i) / var(--n) * 1.5), 1); opacity: var(--q); transform: translateY(calc((1 - var(--q)) * .75em)); will-change: transform, opacity; }
  /* la línea fina y el filete naranja se dibujan de izquierda a derecha al entrar */
  .blq.panel::after, .conoc::after { transform-origin: 0 50%; transform: scaleX(clamp(0, calc(var(--e) * 1.6), 1)); }
  .blq.panel > :first-child::before, .conoc > :first-child::before { transform-origin: 0 50%; transform: scaleX(clamp(0, calc(var(--e) * 3 - .3), 1)); }
  @media (prefers-reduced-motion: reduce) { .pi, .pp { transform: none !important; opacity: 1 !important; } }

  /* ═══ Tipografía con más carácter: el texto principal pasa a Lora grande (serif cálida) y el secundario queda en DM Sans ═══ */
  .blq.panel > p:first-child { font-family: Lora, Georgia, serif; font-size: clamp(18.5px, 1.62vw, 25px); line-height: 1.62; font-weight: 400; letter-spacing: -.003em; color: var(--ink); }
  .blq.panel > p:first-child + ul li { font-family: "DM Sans", system-ui, sans-serif; }
  .info .n { letter-spacing: .24em; }
  .info h1, .info h2 { font-weight: 600; letter-spacing: -.028em; }
  .cita { font-weight: 400; letter-spacing: -.01em; }

  /* ═══ Tamaños que se adaptan también al ALTO de la pantalla: --u es la unidad base y --fit la reduce solo si hace falta ═══ */
  .info { --fit: 1; --u: calc(min(1vw, 1.75vh) * var(--fit)); }
  .info h1 { font-size: clamp(32px, calc(6.4 * var(--u)), 104px); }
  .info h2 { font-size: clamp(26px, calc(4.6 * var(--u)), 74px); }
  .info h3 { font-size: clamp(15px, calc(1.6 * var(--u)), 24px); }
  .info p { font-size: clamp(12.5px, calc(1.2 * var(--u)), 18px); }
  .info .rol { font-size: clamp(16px, calc(1.9 * var(--u)), 28px); }
  .info li { font-size: clamp(12px, calc(1.08 * var(--u)), 16px); }
  .info .datos strong { font-size: clamp(26px, calc(3.8 * var(--u)), 60px); }
  .blq.panel > p:first-child { font-size: clamp(15px, calc(1.62 * var(--u)), 25px); }
  .info .mini b { font-size: clamp(26px, calc(3 * var(--u)), 48px) !important; }
  .info .mini .nm { font-size: clamp(14px, calc(1.4 * var(--u)), 22px) !important; }
  .info .mini span { font-size: clamp(12px, calc(.95 * var(--u)), 15px); }
  .info .iac p { font-size: clamp(12px, calc(1.02 * var(--u)), 15.5px) !important; }
  .info .cita { font-size: clamp(15px, calc(1.55 * var(--u)), 25px) !important; }
  .info .correo { font-size: clamp(18px, calc(2.4 * var(--u)), 36px); }
  .info .tarj b { font-size: clamp(15px, calc(1.8 * var(--u)), 28px); }
  .info .btn { padding: calc(.9 * var(--u)) 0; }

  /* Proyectos: cada tarjeta se une con su isla del mapa */
  #lazos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 19; pointer-events: none; overflow: visible; opacity: 0; }
  #lazos path { fill: none; stroke: var(--acento); stroke-width: 1.8; stroke-dasharray: 2 7; stroke-linecap: round; } #lazos circle { fill: var(--acento); stroke: var(--bg); stroke-width: 2.5; }
  #lazos text { font: 600 11px "JetBrains Mono"; letter-spacing: .1em; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .tarj .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--acento); color: #fff; font: 600 12px "JetBrains Mono"; font-style: normal; margin-bottom: 6px; }
  .info .tel { font: 500 clamp(16px, calc(1.6 * var(--u)), 24px) "Lora"; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }

  /* Flecha discreta junto a la barra de progreso: late muy suave para recordar que se sigue bajando */
  #sigue { position: fixed; z-index: 27; right: calc(clamp(8px, 1.1vw, 18px) + 50px); top: 50%; width: 18px; height: 18px; margin-top: -9px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; opacity: .3; animation: sigue 2.8s ease-in-out infinite; transition: visibility .4s; }
  #sigue.fuera { visibility: hidden; }
  @keyframes sigue { 0%, 100% { opacity: .2; transform: translateY(-2px); } 50% { opacity: .5; transform: translateY(3px); } }
  .info .venta { margin-top: 12px; max-width: 46ch; font-family: Lora, Georgia, serif; font-style: italic; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { #sigue { animation: none; opacity: .35; } }

  /* Herramientas con logo pequeño */
  .info .tec { color: color-mix(in srgb, var(--ink) 80%, var(--bg)); }
  .tl { display: inline-flex; align-items: center; gap: 5px; margin: 0 14px 5px 0; white-space: nowrap; }
  .tl .mi { width: 14px; height: 14px; object-fit: contain; flex: none; }
  .tl .mb { display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 3px; color: #fff; font: 700 8px/1 "JetBrains Mono"; font-style: normal; letter-spacing: 0; flex: none; }
  .tec.herr { margin-top: 10px; }
  .info .hint { font: italic 400 clamp(13px, calc(1.1 * var(--u)), 16px) "Lora"; color: var(--soft); margin: 0 18px 0 -8px; white-space: nowrap; }
  /* Contacto: iconos de Gmail y WhatsApp */
  .ci { width: 1em; height: 1em; vertical-align: -.12em; margin-right: .45em; }
  .info .correo { display: inline-block; } .info .tel { display: inline-block; font-size: clamp(17px, calc(1.8 * var(--u)), 26px); }

  /* Mockup de celular: muestra el proyecto en versión móvil (responsive) junto al video de escritorio */
  .telefono { position: relative; width: 100%; aspect-ratio: 9 / 19.2; padding: 5px; border-radius: 20px; background: linear-gradient(145deg, #2a2420, #0f0c09); box-shadow: 0 30px 60px -18px rgba(40,20,5,.8), 0 0 0 1.5px #4a3f35, inset 0 0 0 1px rgba(255,255,255,.08); }

function geom() {
  tinta.width = innerWidth; tinta.height = innerHeight
  W = innerWidth; Hh = innerHeight; PASO = Hh * 1.6; $('#recorrido').style.height = ((N - 1) * PASO + Hh) + 'px'
  renderer?.setPixelRatio(Math.min(devicePixelRatio, movil() ? 1.5 : 2)); renderer?.setSize(W, Hh, false); cam.aspect = W / Hh; cam.updateProjectionMatrix()
  PARADAS.forEach((p) => {
    const libre = movil() ? .96 : p.id === 'inicio' ? .56 : .74, cerca = p.id === 'inicio' ? 1 : 1.02   // más cerca del mapa: la información ocupa más pantalla
    p.D = (p.ancho * cerca / libre) / (2 * Math.tan(cam.fov * Math.PI / 360) * cam.aspect)
    p.ex = movil() ? (p.id === 'conoc' ? -.16 : 0) : p.dx; p.ey = movil() ? -.2 : p.dy
  })
}
const tmp = new THREE.Vector3()
function estado(p) {
  const i = clamp(Math.floor(p), 0, N - 2), f = clamp(p - i, 0, 1), m = suave((f - .3) / .7), A = PARADAS[i], B = PARADAS[i + 1]
  const dist = Math.hypot(A.x - B.x, A.y - B.y), arco = clamp(dist / 4800, 0, .8) * Math.sin(Math.PI * m) * 1.1
  return { x: lerp(A.x, B.x, m), z: lerp(A.y, B.y, m), D: Math.exp(lerp(Math.log(A.D), Math.log(B.D), m) + arco), yaw: lerp(A.yaw, B.yaw, m), pitch: lerp(A.pitch, B.pitch, m) + arco * 9, dx: lerp(A.ex, B.ex, m), dy: lerp(A.ey, B.ey, m) }
}
function colocar(p) {

  const yaw = (s.yaw + suaveX * 9) * Math.PI / 180, pit = clamp(s.pitch - suaveY * 6, 26, 80) * Math.PI / 180

  cam.position.set(tmp.x + s.D * Math.sin(yaw) * Math.cos(pit), tmp.y + s.D * Math.sin(pit), tmp.z + s.D * Math.cos(yaw) * Math.cos(pit)); cam.lookAt(tmp)

  if (escena.fog) { escena.fog.near = s.D * .7; escena.fog.far = s.D * 2.6 }   // la niebla acompaña a la cámara: lejos se difumina, cerca se ve nítido

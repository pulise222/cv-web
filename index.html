  /* ═══ Estilo «Rótulos»: sin cajas. Filete naranja sobre una línea fina, numerales grandes y una «mancha» de papel de bordes difusos como único fondo ═══ */

const $ = (s, r = document) => r.querySelector(s)
const MW = 6000, MH = 4000
const X0 = -4200, X1 = 10200, Z0 = -3400, Z1 = 7400   // el mundo es mucho mas grande que lo que se visita: no se ven bordes
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, suave = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t) }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }

/* ── Islas: la misma geografía de siempre, ahora con altura (H) para levantar el terreno ── */
const ISLAS = {
  soporte: { cx: 3800, cy: 900, rx: 520, ry: 350, rot: .15, seed: 7, H: 120 },
  pen: { cx: 2000, cy: 1150, rx: 820, ry: 330, rot: -.1, seed: 11, H: 90 },
  sullivan: { cx: 1650, cy: 2450, rx: 240, ry: 170, rot: .3, seed: 21, H: 62 },
  nivel: { cx: 2400, cy: 2850, rx: 340, ry: 240, rot: -.2, seed: 31, H: 84 },
  kairos: { cx: 3150, cy: 2400, rx: 410, ry: 280, rot: .1, seed: 41, H: 100 },
  ia: { cx: 3950, cy: 3350, rx: 450, ry: 300, rot: -.15, seed: 53, H: 110 },
  h1: { cx: 4700, cy: 3650, rx: 150, ry: 105, rot: .2, seed: 61, H: 44 },
  h2: { cx: 5080, cy: 3430, rx: 130, ry: 95, rot: -.3, seed: 62, H: 40 },
  h3: { cx: 4960, cy: 3790, rx: 120, ry: 80, rot: .4, seed: 63, H: 36 },
  h4: { cx: 4430, cy: 3400, rx: 125, ry: 90, rot: -.2, seed: 64, H: 42 }, h5: { cx: 5350, cy: 3730, rx: 125, ry: 85, rot: .3, seed: 65, H: 38 },
  puerto: { cx: 5450, cy: 2350, rx: 370, ry: 260, rot: .2, seed: 73, H: 76 },
  // tierras lejanas sin nombre: dan sensacion de mundo sin fin
  d1: { cx: -900, cy: 500, rx: 420, ry: 260, rot: .4, seed: 81, H: 60, decor: 1 }, d2: { cx: -1200, cy: 3000, rx: 520, ry: 330, rot: -.3, seed: 82, H: 70, decor: 1 },
  d3: { cx: 7000, cy: 1100, rx: 480, ry: 300, rot: .2, seed: 83, H: 66, decor: 1 }, d4: { cx: 6900, cy: 4300, rx: 560, ry: 340, rot: -.2, seed: 84, H: 74, decor: 1 },
  d5: { cx: 2600, cy: -800, rx: 520, ry: 280, rot: .1, seed: 85, H: 58, decor: 1 }, d6: { cx: 4700, cy: 5000, rx: 480, ry: 260, rot: -.35, seed: 86, H: 62, decor: 1 },
  d7: { cx: 600, cy: 4900, rx: 440, ry: 290, rot: .25, seed: 87, H: 56, decor: 1 }, d8: { cx: 5600, cy: -600, rx: 360, ry: 220, rot: -.15, seed: 88, H: 50, decor: 1 },
  d9: { cx: 1100, cy: 1800, rx: 160, ry: 100, rot: .3, seed: 89, H: 34, decor: 1 }, d10: { cx: 4300, cy: 1900, rx: 190, ry: 120, rot: -.4, seed: 90, H: 38, decor: 1 },
}
const KS = 1.4, S = (x, z) => [3000 + (x - 3000) * KS, 2000 + (z - 2000) * KS]   // separa las islas con contenido; las decorativas lejanas no se tocan
for (const k in ISLAS) if (!ISLAS[k].decor) { const q = S(ISLAS[k].cx, ISLAS[k].cy); ISLAS[k].cx = q[0]; ISLAS[k].cy = q[1] }
/* Mar sin fin: islas y archipiélagos sin nombre repartidos por todo el mundo, sin pisar a las islas con contenido */
{ const r = rng(2026), todas = () => Object.values(ISLAS); let n = 0, intentos = 0
  while (n < 46 && intentos++ < 4000) {
    const rx = 140 + r() * 380, ry = rx * (.55 + r() * .4), cx = X0 + 250 + r() * (X1 - X0 - 500), cy = Z0 + 250 + r() * (Z1 - Z0 - 500)
    if (todas().some((o) => Math.hypot(o.cx - cx, o.cy - cy) < Math.max(o.rx, o.ry) + Math.max(rx, ry) * 1.9 + 380)) continue
    const k = 'z' + n++; ISLAS[k] = { cx, cy, rx, ry, rot: r() * 3.1 - 1.5, seed: 500 + n, H: 26 + r() * 46, decor: 1 }
    ISLAS[k].ph = Array.from({ length: 5 }, () => r() * 6.28); ISLAS[k].rough = .12 + r() * .07
  } }
for (const k in ISLAS) { const m = Math.max(ISLAS[k].rx, ISLAS[k].ry) * 2.9; ISLAS[k].alcance2 = m * m }
for (const k in ISLAS) { const r = rng(ISLAS[k].seed); ISLAS[k].ph = Array.from({ length: 5 }, () => r() * 6.28); ISLAS[k].rough = .12 + r() * .07 }
const mult = (I, a) => 1 + I.rough * (.5 * Math.sin(2 * a + I.ph[0]) + .36 * Math.sin(3 * a + I.ph[1]) + .24 * Math.sin(5 * a + I.ph[2]) + .08 * Math.sin(9 * a + I.ph[3]) + .04 * Math.sin(14 * a + I.ph[4]))
const punto = (I, a, k = 1) => { const m = mult(I, a) * k, x = I.rx * m * Math.cos(a), y = I.ry * m * Math.sin(a); return [I.cx + x * Math.cos(I.rot) - y * Math.sin(I.rot), I.cy + x * Math.sin(I.rot) + y * Math.cos(I.rot)] }
/* altura del terreno y «plataforma» submarina (negativa) en un punto del mundo */
const ALT = 2.4   // exageración vertical: las islas se elevan más sobre el mar
function relieve(x, z) {
  let h = 0, S = 0
  for (const k in ISLAS) {
    const I = ISLAS[k], dx = x - I.cx, dz = z - I.cy
    if (dx * dx + dz * dz > I.alcance2) continue   // isla demasiado lejos: no afecta a este punto
    const lx = dx * Math.cos(I.rot) + dz * Math.sin(I.rot), lz = -dx * Math.sin(I.rot) + dz * Math.cos(I.rot)
    const a = Math.atan2(lz / I.ry, lx / I.rx), r = Math.hypot(lx / I.rx, lz / I.ry) / mult(I, a)
    if (r < 1) { const t = 1 - r, n = (Math.sin(x * .0105 + I.ph[0]) * Math.sin(z * .0125 + I.ph[1]) + .55 * Math.sin(x * .026 + z * .02 + I.ph[2])) * .5 + .5
      h = Math.max(h, ALT * I.H * Math.pow(t, .62) * (.7 + .55 * n * Math.min(1, t * 2.2))) }
    if (r < 2.4) S += Math.exp(-7 * r)   // mínimo suave de las distancias: las ondas de costa ya no forman escalones entre islas
  }
  const rs = S > 0 ? -Math.log(S) / 7 : 9
  return [h, rs > 1 && rs < 1.9 ? -(rs - 1) : 0]
}
